<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hd@freiburg — Desktop</title>
<meta name="description" content="Interactive desktop-environment portfolio of Hoang Huy Dang, MSc Computer Science student at the University of Freiburg. Machine learning, AutoML, and model evaluation.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---- Breeze-ish tokens ---- */
:root{
  --accent:#3daee9; --accent-2:#2980b9; --accent-3:#2fe0c0;
  --win:#2a2e32; --win-2:#232629; --title:#31363b; --title-in:#2a2e32;
  --ink:#eff0f1; --ink-2:#bdc3c7; --muted:#7f8c8d;
  --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --panel:rgba(28,31,34,.86);
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --panel-h:48px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);overflow:hidden;
  background:#0d1b26;-webkit-font-smoothing:antialiased;user-select:none;
}
/* ---- wallpaper ---- */
#wall{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(1100px 700px at 78% 12%,rgba(61,174,233,.30),transparent 62%),
    radial-gradient(900px 620px at 12% 88%,rgba(47,224,192,.16),transparent 62%),
    linear-gradient(155deg,#0f2233 0%,#123044 38%,#0b1a26 100%)}
#wall svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
/* ---- desktop icons ---- */
#icons{position:fixed;top:18px;left:18px;z-index:1;display:flex;flex-direction:column;
  flex-wrap:wrap;max-height:calc(100vh - var(--panel-h) - 40px);gap:4px;align-content:flex-start}
.dicon{width:96px;padding:10px 6px 8px;border:1px solid transparent;border-radius:8px;background:none;
  color:#fff;font:inherit;font-size:.78rem;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:8px;text-align:center;line-height:1.25;transition:background .15s,border-color .15s}
.dicon:hover{background:rgba(61,174,233,.22);border-color:rgba(61,174,233,.45)}
.dicon:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dicon span{text-shadow:0 1px 3px rgba(0,0,0,.75)}
.gi{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  box-shadow:0 5px 14px -6px rgba(0,0,0,.8);border:1px solid rgba(255,255,255,.16)}
.gi svg{width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.g-blue{background:linear-gradient(150deg,#3daee9,#2472a4)}
.g-teal{background:linear-gradient(150deg,#2fe0c0,#12836f)}
.g-vio{background:linear-gradient(150deg,#8e7bff,#5b46c9)}
.g-amber{background:linear-gradient(150deg,#ffc06b,#d1873a)}
.g-slate{background:linear-gradient(150deg,#5d6b7a,#333c45)}
.g-rose{background:linear-gradient(150deg,#ff7b8a,#c74551)}
.g-fold{background:linear-gradient(150deg,#6bc7ff,#2a7fb8)}
/* ---- windows ---- */
.win{position:fixed;z-index:10;display:flex;flex-direction:column;min-width:280px;min-height:170px;
  background:var(--win);border:1px solid var(--line-2);border-radius:9px;overflow:hidden;
  box-shadow:0 26px 60px -20px rgba(0,0,0,.85),0 0 0 1px rgba(0,0,0,.4)}
.win.max{border-radius:0}
.win.min{display:none}
.win.front{box-shadow:0 34px 80px -18px rgba(0,0,0,.92),0 0 0 1px rgba(61,174,233,.25)}
.tbar{display:flex;align-items:center;gap:10px;height:36px;padding:0 6px 0 12px;flex:0 0 auto;
  background:var(--title-in);border-bottom:1px solid rgba(0,0,0,.35);cursor:grab;touch-action:none}
.win.front .tbar{background:var(--title)}
.win.max .tbar{cursor:default}
.tbar .ti{width:15px;height:15px;flex:0 0 auto}
.tbar .ti svg{width:15px;height:15px;fill:none;stroke:var(--accent);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tbar b{font-size:.83rem;font-weight:600;letter-spacing:-.01em;color:var(--ink-2);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.win.front .tbar b{color:var(--ink)}
.wbtns{display:flex;gap:2px;flex:0 0 auto}
.wbtn{width:28px;height:26px;border:0;border-radius:5px;background:none;cursor:pointer;color:var(--ink-2);
  display:grid;place-items:center;transition:background .15s,color .15s}
.wbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.wbtn.x:hover{background:#c0392b;color:#fff}
.wbtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.body{flex:1 1 auto;overflow:auto;padding:22px 24px;background:var(--win-2);
  font-size:.92rem;line-height:1.62;color:var(--ink-2);user-select:text;overscroll-behavior:contain}
.body::-webkit-scrollbar{width:10px}
.body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:8px}
.rsz{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;
  background:linear-gradient(135deg,transparent 48%,var(--line-2) 48%,var(--line-2) 62%,transparent 62%)}
.win.max .rsz{display:none}
/* ---- window content ---- */
.body h1{font-size:1.35rem;letter-spacing:-.03em;margin:0 0 4px;color:var(--ink)}
.body h2{font-size:.74rem;font-family:var(--mono);letter-spacing:.13em;text-transform:uppercase;
  color:var(--accent-3);margin:26px 0 12px;font-weight:500}
.body h2:first-child{margin-top:0}
.body h3{font-size:.98rem;margin:0 0 6px;color:var(--ink);letter-spacing:-.01em}
.body p{margin:0 0 13px}
.body strong{color:var(--ink);font-weight:600}
.sub{font-family:var(--mono);font-size:.78rem;color:var(--muted);margin:0 0 18px}
.hr{height:1px;background:var(--line);margin:20px 0;border:0}
.card{border:1px solid var(--line);border-radius:9px;padding:17px;margin-bottom:12px;
  background:rgba(255,255,255,.026);transition:border-color .2s}
.card:hover{border-color:var(--line-2)}
.card .kind{font-family:var(--mono);font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;
  color:#ffc06b;margin-bottom:9px}
.card dl{display:grid;grid-template-columns:66px 1fr;gap:11px;margin:0 0 8px;font-size:.87rem}
.card dt{font-family:var(--mono);font-size:.65rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.card dd{margin:0}
.card dl.res dd{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-family:var(--mono);font-size:.7rem;color:var(--ink-2);background:rgba(255,255,255,.05);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.kv{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500;padding-top:3px}
.stat{display:flex;gap:22px;flex-wrap:wrap;margin:4px 0 20px}
.stat div{min-width:88px}
.stat .n{font-family:var(--mono);font-size:1.3rem;color:var(--accent-3);line-height:1;font-variant-numeric:tabular-nums}
.stat .c{font-size:.72rem;color:var(--muted);margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:9px 16px;border-radius:8px;
  font:inherit;font-size:.88rem;font-weight:600;text-decoration:none;cursor:pointer;
  background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#fff;border:1px solid rgba(0,0,0,.28)}
.btn:hover{filter:brightness(1.09)}
.btn.gh{background:none;border-color:var(--line-2);color:var(--ink)}
.btn.gh:hover{border-color:var(--accent);background:rgba(61,174,233,.12);filter:none}
ul{margin:8px 0 0;padding-left:19px}
li{margin-bottom:5px}
.note{font-size:.8rem;color:var(--muted);border-left:2px solid var(--line-2);padding-left:12px;margin-top:18px}
figure{margin:0}
figcaption{font-family:var(--mono);font-size:.7rem;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:14px}
figcaption i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
/* ---- file listing (folder windows) ---- */
.crumb{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin:0 0 15px;padding:7px 10px;
  border:1px solid var(--line);border-radius:6px;background:rgba(0,0,0,.22)}
.files{display:flex;flex-direction:column;gap:2px}
.file{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:1px solid transparent;
  border-radius:7px;background:none;color:var(--ink);font:inherit;font-size:.88rem;text-align:left;cursor:pointer}
.file:hover{background:rgba(61,174,233,.18);border-color:rgba(61,174,233,.42)}
.file:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.file .gi{width:31px;height:31px;border-radius:8px;flex:0 0 auto}
.file .gi svg{width:16px;height:16px}
.file small{display:block;color:var(--muted);font-size:.72rem;font-family:var(--mono);margin-top:2px}
/* ---- inline pdf viewer ---- */
.body.raw{padding:0;background:#1b1e21;display:flex;flex-direction:column;overflow:hidden}
.pdfbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:7px 10px;background:#232629;
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.pdfbar a{margin-left:auto;color:var(--ink-2);text-decoration:none;border:1px solid var(--line-2);
  border-radius:5px;padding:4px 9px;white-space:nowrap}
.pdfbar a:hover{border-color:var(--accent);color:#fff}
.body.raw iframe{flex:1 1 auto;width:100%;border:0;display:block;background:#1b1e21}
/* ---- terminal ---- */
.term{background:#15181b;padding:15px 16px;font-family:var(--mono);font-size:.83rem;line-height:1.62;color:#d5dbe0}
.term .ln{white-space:pre-wrap;word-break:break-word}
.term .p{color:var(--accent-3)}
.term .er{color:#ff7b8a}
.term .hi{color:#ffc06b}
.term .in{display:flex;gap:9px;align-items:baseline}
.term input{flex:1;background:none;border:0;outline:none;color:#d5dbe0;font:inherit;padding:0;caret-color:var(--accent-3)}
/* ---- panel ---- */
#panel{position:fixed;left:0;right:0;bottom:0;height:var(--panel-h);z-index:100;display:flex;align-items:center;
  gap:8px;padding:0 10px;background:var(--panel);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#kick{display:flex;align-items:center;gap:9px;height:36px;padding:0 13px 0 10px;border:0;border-radius:6px;
  background:rgba(61,174,233,.16);color:#fff;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;flex:0 0 auto}
#kick:hover{background:rgba(61,174,233,.32)}
#kick svg{width:17px;height:17px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round}
#tasks{display:flex;gap:6px;flex:1 1 auto;min-width:0;overflow:hidden}
.task{display:flex;align-items:center;gap:8px;height:34px;max-width:186px;padding:0 13px;border:0;
  border-bottom:2px solid transparent;border-radius:5px;background:rgba(255,255,255,.06);color:var(--ink-2);
  font:inherit;font-size:.81rem;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task:hover{background:rgba(255,255,255,.13);color:#fff}
.task.on{background:rgba(61,174,233,.2);border-bottom-color:var(--accent);color:#fff}
.tray{display:flex;align-items:center;gap:12px;flex:0 0 auto;font-size:.8rem;color:var(--ink-2)}
.tray a{color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.tray a:hover{border-color:var(--accent);color:#fff}
#clock{font-family:var(--mono);font-size:.78rem;text-align:right;line-height:1.25;font-variant-numeric:tabular-nums}
#clock small{display:block;color:var(--muted);font-size:.68rem}
/* ---- launcher ---- */
#menu{position:fixed;left:10px;bottom:calc(var(--panel-h) + 8px);width:290px;z-index:101;display:none;
  background:rgba(35,38,41,.97);backdrop-filter:blur(18px);border:1px solid var(--line-2);border-radius:10px;
  padding:9px;box-shadow:0 26px 60px -18px rgba(0,0,0,.9)}
#menu.on{display:block}
#menu .mh{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);padding:7px 10px 9px}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border:0;border-radius:7px;
  background:none;color:var(--ink);font:inherit;font-size:.87rem;text-align:left;cursor:pointer;text-decoration:none}
.mi:hover{background:rgba(61,174,233,.2)}
.mi .gi{width:29px;height:29px;border-radius:8px}
.mi .gi svg{width:16px;height:16px}
.mi small{display:block;color:var(--muted);font-size:.71rem;font-weight:400}
#menu .hr{margin:8px 4px}
/* ---- hint + mobile ---- */
#hint{position:fixed;right:14px;top:14px;z-index:90;max-width:250px;padding:12px 14px;border-radius:9px;
  background:rgba(35,38,41,.9);backdrop-filter:blur(12px);border:1px solid var(--line-2);
  font-size:.78rem;color:var(--ink-2);line-height:1.5}
#hint b{color:var(--ink);display:block;margin-bottom:4px;font-size:.8rem}
#hint button{margin-top:9px;background:none;border:1px solid var(--line-2);border-radius:6px;color:var(--ink-2);
  font:inherit;font-size:.74rem;padding:4px 9px;cursor:pointer}
#hint button:hover{border-color:var(--accent);color:#fff}
@media (max-width:820px){
  #icons{flex-direction:row;flex-wrap:wrap;max-height:none;right:14px;gap:2px}
  .dicon{width:78px;font-size:.72rem}
  #hint{display:none}
  .tray .lbl{display:none}
  .task{max-width:120px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="wall" aria-hidden="true">
  <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1">
      <path d="M0 640 C220 560 380 690 620 600 S980 500 1200 566"/>
      <path d="M0 700 C240 620 400 748 640 660 S1000 566 1200 626"/>
      <path d="M0 580 C200 500 360 632 600 540 S960 434 1200 506"/>
    </g>
    <g stroke="rgba(61,174,233,.16)" stroke-width="1" fill="none">
      <circle cx="960" cy="180" r="150"/><circle cx="960" cy="180" r="96"/><circle cx="960" cy="180" r="44"/>
    </g>
    <g fill="rgba(255,255,255,.05)">
      <circle cx="180" cy="150" r="2.5"/><circle cx="300" cy="96" r="2"/><circle cx="420" cy="190" r="2.5"/>
      <circle cx="140" cy="300" r="2"/><circle cx="680" cy="120" r="2"/><circle cx="820" cy="330" r="2.5"/>
    </g>
  </svg>
</div>

<div id="icons"></div>

<aside id="hint">
  <b>Interactive desktop</b>
  Click an icon to open a window. Drag titlebars, resize from the corner, or try the terminal.
  <button type="button" id="hintx">Got it</button>
</aside>

<div id="wins"></div>

<div id="menu" role="menu" aria-label="Application launcher"></div>

<footer id="panel">
  <button id="kick" type="button" aria-haspopup="true" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg> Applications
  </button>
  <div id="tasks" aria-label="Open windows"></div>
  <div class="tray">
    <a href="index.html"><span class="lbl">Plain&nbsp;version</span><span aria-hidden="true">↗</span></a>

  </div>
</footer>

<script>
(function(){
"use strict";

var EMAIL = "hd103@email.uni-freiburg.de";

/* ---------- icon glyphs ---------- */
var G = {
  about:   '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>',
  projects:'<svg viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h7A1.5 1.5 0 0 1 19 10v7.5A1.5 1.5 0 0 1 17.5 19h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>',
  research:'<svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16"/><path d="M7 15c3-7 6.5-8.5 12-9"/><path d="M12 19v-4M17 19v-7"/></svg>',
  cv:      '<svg viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20z"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6"/></svg>',
  term:    '<svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="1.6"/><path d="M7 10l2.5 2L7 14M12 14.5h5"/></svg>',
  mail:    '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.6"/><path d="M3.6 6.2 12 13l8.4-6.8"/></svg>',
  folder:  '<svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l1.9 2.4h9A1.4 1.4 0 0 1 21 8.8v8.7A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>'
};
function icon(k, cls){ return '<span class="gi ' + cls + '" aria-hidden="true">' + G[k] + '</span>'; }

/* ---------- window content ---------- */
function aboutHTML(){ return ''
  + '<h1>Hoang Huy Dang</h1>'
  + '<p class="sub">MSc Computer Science · University of Freiburg · AutoML &amp; foundation models</p>'
  + '<p>I build systems that answer expensive questions early: <strong>how good will this model be</strong> '
  + 'before training finishes, <strong>which hyperparameters matter</strong>, and <strong>can the model\u2019s own '
  + 'confidence be trusted</strong>.</p>'
  + '<p>My work is turning a messy question into a reproducible experiment \u2014 clear metrics, honest '
  + 'uncertainty, and results a team can act on.</p>'
  + '<div class="stat">'
  + '<div><div class="n">380k+</div><div class="c">predictions analysed</div></div>'
  + '<div><div class="n">14</div><div class="c">context strategies</div></div>'
  + '<div><div class="n">2</div><div class="c">model families</div></div>'
  + '<div><div class="n">4</div><div class="c">model scales</div></div>'
  + '</div>'
  + '<h2>Currently</h2>'
  + '<p>Finishing my MSc and looking for a <strong>master\u2019s thesis or working-student role</strong> in applied '
  + 'ML, AutoML, or LLM evaluation.</p>'
  + '<a class="btn" href="mailto:' + EMAIL + '">Email me</a>'; }

function projectsHTML(){
  var P = [
    ['01','Master project','Predicting a model\u2019s final quality from a partial training run',
     'Training large models is expensive. Teams want to stop weak runs early, but early loss curves are noisy and easy to misread.',
     'A pipeline that forecasts final validation loss from a fraction of a curve, using two foundation-model families (ifBO/FT-PFN and TabPFN-style predictors) and 14 strategies for choosing which past runs to condition on.',
     'Found which strategies transfer from small to large scales, and showed the two families differ sharply in how stable their uncertainty is \u2014 judged by interval scores and coverage, not accuracy alone.',
     ['Python','PyTorch','TabPFN','pandas','Slurm','calibration']],
    ['02','AutoML','Searching for an architecture and its hyperparameters at once',
     'Architecture and hyperparameters are usually tuned separately, so a promising architecture gets discarded because it was tested with bad settings.',
     'A joint NAS + HPO search over convolutional models on Fashion-MNIST, with a shared budget and a comparison of search strategies against random search.',
     'A working end-to-end AutoML pipeline, plus a practical read on where a limited search budget actually pays off.',
     ['Python','PyTorch','NAS','HPO']],
    ['03','Deep learning','Does switching optimizers mid-training actually help?',
     'Adam converges fast early, SGD often generalises better late. Practitioners debate switching with little controlled evidence.',
     'A benchmark that switches optimizers at different points during training and tracks convergence speed and final accuracy across settings.',
     'Quantified when switching helps and when it costs accuracy; presented as a research poster.',
     ['Python','PyTorch','benchmarking']],
    ['04','Industry internship','ERP features non-technical teams actually use',
     'A client\u2019s business processes did not fit the out-of-the-box ERP, and manual workarounds cost staff hours every week.',
     'Custom Odoo modules and data migrations, translating business requirements into working features, with testing and maintenance.',
     'Shipped features into production use \u2014 early practice at the part I still enjoy most: turning a vague manual process into something automated.',
     ['Python','PostgreSQL','JavaScript','XML']]
  ];
  var h = '<h1>Projects</h1><p class="sub">4 items \u00b7 problem \u2192 built \u2192 result</p>';
  for (var i = 0; i < P.length; i++) {
    var p = P[i], c = '';
    for (var j = 0; j < p[6].length; j++) c += '<span class="chip">' + p[6][j] + '</span>';
    h += '<div class="card"><div class="kind">' + p[0] + ' \u2014 ' + p[1] + '</div>'
       + '<h3>' + p[2] + '</h3>'
       + '<dl><dt>Problem</dt><dd>' + p[3] + '</dd></dl>'
       + '<dl><dt>Built</dt><dd>' + p[4] + '</dd></dl>'
       + '<dl class="res"><dt>Result</dt><dd>' + p[5] + '</dd></dl>'

function closeWin(id){

  for (k in wins) if (wins[k] && !wins[k].el.classList.contains('min')) {
    if (!top || +wins[k].el.style.zIndex > +top.style.zIndex) top = wins[k].el;

  else { w.el.classList.add('min'); syncTasks(); }

function toggleMax(id){
  var w = wins[id], el = w.el;
  if (el.classList.contains('max')) {
    el.classList.remove('max');

  } else {
    w.r = {left:el.style.left, top:el.style.top, w:el.style.width, h:el.style.height};
    el.classList.add('max');
    el.style.left = '0px'; el.style.top = '0px';
    el.style.width = '100%'; el.style.height = 'calc(100% - var(--panel-h))';
  }

function drag(el, handle){
  handle.addEventListener('pointerdown', function(e){
    if (e.target.closest('.wbtn')) return;
    focusWin(el);
    if (el.classList.contains('max')) return;
    var r = el.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    handle.setPointerCapture(e.pointerId);
    function mv(ev){
      var maxX = innerWidth - 80, maxY = innerHeight - 56 - 40;
      el.style.left = Math.min(Math.max(ev.clientX - dx, 90 - r.width), maxX) + 'px';
      el.style.top  = Math.min(Math.max(ev.clientY - dy, 0), maxY) + 'px';
    }
    function up(){
      handle.removeEventListener('pointermove', mv);
      handle.removeEventListener('pointerup', up);
      handle.removeEventListener('pointercancel', up);
    }
    handle.addEventListener('pointermove', mv);
    handle.addEventListener('pointerup', up);
    handle.addEventListener('pointercancel', up);
  });
}
function resize(el, grip){
  grip.addEventListener('pointerdown', function(e){
    e.stopPropagation(); focusWin(el);
    var r = el.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY, w0 = r.width, h0 = r.height;
    grip.setPointerCapture(e.pointerId);
    function mv(ev){
      el.style.width  = Math.max(280, w0 + ev.clientX - x0) + 'px';
      el.style.height = Math.max(170, h0 + ev.clientY - y0) + 'px';
    }
    function up(){
      grip.removeEventListener('pointermove', mv);
      grip.removeEventListener('pointerup', up);
      grip.removeEventListener('pointercancel', up);
    }
    grip.addEventListener('pointermove', mv);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
  });
}

function initTerm(body){
  var line = document.createElement('div');
  line.className = 'in';
  line.innerHTML = '<span class="p">hd@freiburg:~$</span>';
  var inp = document.createElement('input');
  inp.type = 'text'; inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.setAttribute('aria-label','Terminal input');
  line.appendChild(inp); body.appendChild(line);

  var hist = [], hp = 0;
  function echo(txt, cls){
    var d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    d.textContent = txt;
    body.insertBefore(d, line);
  }
  function run(raw){
    var cmd = raw.trim(), parts = cmd.split(/\s+/), name = (parts[0] || '').toLowerCase();
    echo('hd@freiburg:~$ ' + cmd, 'hi');
    if (!cmd) return;
    hist.push(cmd); hp = hist.length;
    if (name === 'clear') {
      var n = body.querySelectorAll('.ln');
      for (var i = 0; i < n.length; i++) n[i].remove();
      return;
    }
    if (name === 'exit') { closeWin('terminal'); return; }
    if (name === 'open') {
      var t = (parts[1] || '').toLowerCase();
      if (APPS[t]) { open(t); echo('opening ' + APPS[t].t + '\u2026'); }
      else echo('open: unknown app \u2014 try about|projects|research|cv|contact', 'er');
      return;
    }
    if (name === 'cat' && /cv/.test(parts[1] || '')) { open('cv'); echo('opening CV\u2026'); return; }
    if (CMDS[name]) { echo(CMDS[name]()); if (name === 'cv') open('cv'); return; }
    if (name === 'cv') { open('cv'); echo('opening CV\u2026'); return; }
    echo(name + ': command not found \u2014 type "help"', 'er');
  }
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { run(inp.value); inp.value = ''; body.scrollTop = body.scrollHeight; }
    else if (e.key === 'ArrowUp') { if (hp > 0) { inp.value = hist[--hp] || ''; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (hp < hist.length) { inp.value = hist[++hp] || ''; } e.preventDefault(); }
  });
  body.addEventListener('click', function(e){ if (!e.target.closest('a,button')) inp.focus(); });
  setTimeout(function(){ inp.focus(); }, 60);
}

document.addEventListener('click', function(e){
  var b = e.target.closest('[data-app]');
  if (b) { open(b.dataset.app); if (b.classList.contains('mi')) setMenu(false); return; }
  if (!e.target.closest('#menu,#kick')) setMenu(false);
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (menu.classList.contains('on')) { setMenu(false); return; }
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  var top = null, k;
  for (k in wins) if (wins[k] && wins[k].el.classList.contains('front')) top = k;
  if (top) closeWin(top);
});
var hint = document.getElementById('hint');
document.getElementById('hintx').addEventListener('click', function(){ hint.remove(); });

(function clock(){
  var el = document.getElementById('clock');
  function tick(){
    var d = new Date();
    el.innerHTML = '<span>' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0')
      + '</span><small>' + d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}) + '</small>';
  }
  tick(); setInterval(tick, 20000);
})();

/* open a window on load so the page is never empty */
setTimeout(function(){ open(mobile() ? 'about' : 'about'); }, 260);
if (!mobile()) setTimeout(function(){ open('research'); }, 620);

})();
